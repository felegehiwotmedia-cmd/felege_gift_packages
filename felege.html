        /* Custom smooth entrance animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }
        }

        .animate-fade-down {
            animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }

        .animate-pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        /* Modal scale transition */
        #booking-modal {
            transition: opacity 0.3s ease, backdrop-filter 0.3s ease;
        }
        #booking-modal > div {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        #booking-modal.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #booking-modal.hidden > div {
            transform: scale(0.95) translateY(20px);

        function renderPackages(filter = 'all') {
            const grid = document.getElementById('packages-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' 
                ? packagesData 
                : packagesData.filter(p => p.category === filter);

            filtered.forEach((pkg, index) => {
                const card = document.createElement('div');
                // Added staggered fade-up animation via inline style delay
                card.className = 'bg-white rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1.5 transition-all duration-300 overflow-hidden flex flex-col justify-between group opacity-0 animate-fade-up';
                card.style.animationDelay = `${index * 0.04}s`;
                
                let itemsListHtml = pkg.items.map(item => `<li class="flex items-center space-x-2"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 flex-shrink-0"></span><span class="truncate">${item}</span></li>`).join('');

                card.innerHTML = `
                    <div>
                        <div class="p-4 pb-2.5 text-center bg-gradient-to-b from-emerald-50/70 to-transparent">
                            <h4 class="text-sm sm:text-base font-bold text-slate-900 ethiopic truncate">${pkg.title}</h4>
                            <span class="text-base sm:text-lg font-extrabold text-emerald-600 mt-0.5 inline-block">${pkg.price}</span>
                        </div>
                        <div class="relative overflow-hidden aspect-video bg-slate-100">
                            <img src="${pkg.image}" alt="${pkg.title}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700 ease-out" onerror="this.src='https://placehold.co/600x400/e2e8f0/64748b?text=Gift+Package'">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        </div>
                        <div class="p-4 sm:p-5">
                            <ul class="text-xs sm:text-sm text-slate-600 space-y-2 ethiopic">
                                ${itemsListHtml}
                            </ul>
                        </div>
                    </div>
                    <div class="p-4 sm:p-5 pt-0">
                        <button onclick="openBooking(${pkg.id})" class="w-full py-3 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 text-white font-semibold text-xs sm:text-sm shadow-md shadow-emerald-500/20 hover:shadow-lg hover:shadow-emerald-500/35 hover:opacity-95 active:scale-[0.98] transition-all duration-300 ethiopic text-center flex items-center justify-center gap-2">
                            <span>ይህንን የመረጥኩት</span> 🎁
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white', 'shadow-lg', 'shadow-emerald-600/25', 'hover:-translate-y-0.5');
                btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200/80');
            });
            event.currentTarget.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200/80');
            event.currentTarget.classList.add('bg-emerald-600', 'text-white', 'shadow-lg', 'shadow-emerald-600/25', 'hover:-translate-y-0.5');
            
            renderPackages(category);
        }

        function openBooking(id) {
            const pkg = packagesData.find(p => p.id === id);
            if(!pkg) return;

            document.getElementById('selected-package-id').value = pkg.id;
            document.getElementById('modal-category').innerText = pkg.categoryName;
            document.getElementById('modal-title').innerText = pkg.title;
            document.getElementById('modal-price').innerText = pkg.price;
            
            const modal = document.getElementById('booking-modal');
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('booking-modal');
            modal.classList.add('hidden');
        }

        // Close modal when clicking outside content area
        document.getElementById('booking-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        function submitBooking(e) {
            e.preventDefault();
            
            const pkgId = document.getElementById('selected-package-id').value;
            const pkg = packagesData.find(p => p.id == pkgId);
            
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const address = document.getElementById('cust-address').value;
            const date = document.getElementById('cust-date').value;
            const note = document.getElementById('cust-note').value || 'የሌለ';

            const text = `🎁 አዲስ የስጦታ ትዕዛዝ (ፈለገ Gift Package)\n\n` +
                         `📦 ፓኬጅ: ${pkg ? pkg.title : 'ስጦታ'} (${pkg ? pkg.price : ''})\n` +
                         `📂 ምድብ: ${pkg ? pkg.categoryName : ''}\n\n` +
                         `👤 ስም: ${name}\n` +
                         `📞 ስልክ: ${phone}\n` +
                         `📍 አድራሻ: ${address}\n` +
                         `📅 የማድረሻ ቀን: ${date}\n` +
                         `💌 የካርድ መልእክት: ${note}`;

            const encodedText = encodeURIComponent(text);
            const telegramUrl = `https://t.me/felegeh07?text=${encodedText}`;

            closeModal();
            window.open(telegramUrl, '_blank');
        }

        window.onload = function() {
            renderPackages('all');
        };
    </script>
